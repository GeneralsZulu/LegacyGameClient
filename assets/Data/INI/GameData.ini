;//////////////////////////////////////////////////////////////////////////////
; FILE: GameData.ini (Zulu mod overlay) ////////////////////////////////////////
; Loaded with INI_LOAD_OVERWRITE after mods are mounted, so only the fields
; listed here override the base game's GameData. Add fields as needed.
;//////////////////////////////////////////////////////////////////////////////

GameData
  ; MaxCameraHeight reverted to vanilla default (300). Widescreen zoom-out is
  ; now handled by aspect-ratio scaling in W3DView::setDefaultView.

  ; Raise the retail 30fps render cap to 60. Game speed no longer depends on
  ; render fps (the engine paces logic at 30 logic fps and catches up when
  ; render frames run long), so the cap is purely presentational. 60 rather
  ; than uncapped or 240: pushing frames flat out congests virtual and weak
  ; GPUs (VMware guests plateau near 17fps while a paced 60 holds 60), and 60
  ; matches the smoothness bar set by GeneralsOnline. Applies to network games
  ; too; only the catchup fast-forward paths render uncapped.
  FramesPerSecondLimit = 60
End
