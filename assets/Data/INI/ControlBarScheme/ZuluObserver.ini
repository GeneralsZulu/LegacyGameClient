; Zulu observer control bar scheme. Loaded in addition to the installed
; ControlBarScheme.ini (the engine loads the ControlBarScheme directory),
; and wins the Side Observer selection on every machine because scheme
; matching prefers the largest ScreenCreationRes (stock is 800, ControlBarPro
; is 1920). Layout mirrors the ControlBarPro observer bar, authored at
; 2560x1440; art ships in Zulu.big so no UI mod is required.

ControlBarScheme ZuluObserver
  ScreenCreationRes X:2560 Y:1440
  Side Observer
  QueueButtonImage SCBigButton
  RightHUDImage ZuluObsBlank
  CommandBarBorderColor R:44 G:139 B:101 A:255
  BuildUpClockColor R:0 G:0 B:0 A:160
  ButtonBorderBuildColor R:91 G:146 B:255 A:255
  ButtonBorderActionColor R:0 G:222 B:1 A:255
  ButtonBorderUpgradeColor R:208 G:108 B:0 A:255
  ButtonBorderSystemColor R:255 G:240 B:5 A:255

  GenBarButtonIn ZuluObsBlank
  GenBarButtonOn ZuluObsBlank

  ToggleButtonUpIn ZuluObsBlank
  ToggleButtonUpOn ZuluObsBlank
  ToggleButtonUpPushed ZuluObsBlank

  ToggleButtonDownIn ZuluObsBlank
  ToggleButtonDownOn ZuluObsBlank
  ToggleButtonDownPushed ZuluObsBlank

  OptionsButtonEnable ZuluObsOptions
  OptionsButtonHightlited ZuluObsOptionsH
  OptionsButtonPushed ZuluObsOptionsP
  OptionsButtonDisabled ZuluObsOptionsI
  IdleWorkerButtonEnable SAWorker
  IdleWorkerButtonHightlited SAWorkerH
  IdleWorkerButtonPushed SAWorkerP
  IdleWorkerButtonDisabled SAWorkerI
  BuddyButtonEnable ZuluObsChat
  BuddyButtonHightlited ZuluObsChatH
  BuddyButtonPushed ZuluObsChatP
  BuddyButtonDisabled ZuluObsChatI

  BeaconButtonEnable ZuluObsBlank
  BeaconButtonHightlited ZuluObsBlank
  BeaconButtonPushed ZuluObsBlank
  BeaconButtonDisabled ZuluObsBlank

  GeneralButtonEnable ZuluObsBlank
  GeneralButtonHightlited ZuluObsBlank
  GeneralButtonPushed ZuluObsBlank
  GeneralButtonDisabled ZuluObsBlank

  UAttackButtonEnable ZuluObsBlank
  UAttackButtonHightlited ZuluObsBlank
  UAttackButtonPushed ZuluObsBlank

  MinMaxButtonEnable ZuluObsBlank
  MinMaxButtonHightlited ZuluObsBlank
  MinMaxButtonPushed ZuluObsBlank
  MinMaxUL X:0 Y:0
  MinMaxLR X:0 Y:0
  GeneralUL X:0 Y:0
  GeneralLR X:0 Y:0
  UAttackUL X:0 Y:0
  UAttackLR X:0 Y:0

  OptionsUL X:445 Y:1348
  OptionsLR X:505 Y:1388
  WorkerUL X:508 Y:1348
  WorkerLR X:568 Y:1388
  ChatUL X:445 Y:1391
  ChatLR X:505 Y:1431
  BeaconUL X:0 Y:0
  BeaconLR X:0 Y:0

  PowerBarUL X:443 Y:1193
  PowerBarLR X:1096 Y:1207
  ExpBarForegroundImage SAExpBar
  MoneyUL X:933 Y:1216
  MoneyLR X:1093 Y:1261

  CommandMarkerImage SAEmptyFrame
  ImagePart
    Position X:0 Y:757
    Size X:2560 Y:683
    ImageName ZuluObsCommandBar
    Layer 4
  End
  PowerPurchaseImage GeneralsPowerMenu_China
End
